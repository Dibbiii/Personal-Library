# Segnalibro application and PostgreSQL.
services:
  app:
    build: .
    container_name: personal-library
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://segnalibro_app:${SEGNALIBRO_APP_PASSWORD:-segnalibro_app}@db:5432/segnalibro
      SESSION_COOKIE_NAME: sb-session
      STORAGE_DIR: /app/storage
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
    volumes:
      - segnalibro_storage:/app/storage
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.personal-library.rule=Host(`personal-library.alessandrobrunoh.it`)
      - traefik.http.routers.personal-library.entrypoints=websecure
      - traefik.http.routers.personal-library.tls=true
      - traefik.http.routers.personal-library.tls.certresolver=le
      - traefik.http.services.personal-library.loadbalancer.server.port=3000
      
  db:
    image: postgres:17
    container_name: segnalibro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: segnalibro
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - segnalibro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d segnalibro']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  segnalibro_pgdata:
    name: segnalibro_pgdata
  segnalibro_storage:
    name: personal_library_storage

networks:
  proxy:
    external: true
