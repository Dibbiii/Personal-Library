# Segnalibro application and PostgreSQL.
services:
  app:
    build: .
    image: ghcr.io/dibbiii/personal-libvrary:latest
    container_name: personal-library
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://segnalibro_app:${SEGNALIBRO_APP_PASSWORD:-segnalibro_app}@db:5432/segnalibro
      DATABASE_ADMIN_URL: postgres://postgres:postgres@db:5432/segnalibro
      SESSION_COOKIE_NAME: [REDACTED]
      STORAGE_DIR: /app/storage
      BODY_SIZE_LIMIT: 6M
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      SBN_BRIDGE_URL: http://sbn:8080
    volumes:
      - segnalibro_storage:/app/storage
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.personal-library.rule=Host(`personal-library.alessandrobrunoh.it`)
      - traefik.http.routers.personal-library.entrypoints=websecure
      - traefik.http.routers.personal-library.tls=true
      - traefik.http.routers.personal-library.tls.certresolver=le
      - traefik.http.services.personal-library.loadbalancer.server.port=3000

  sbn:
    build: ./services/sbn
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 3s
      retries: 3

  db:
    image: postgres:17
    container_name: segnalibro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: segnalibro
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - segnalibro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d segnalibro']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  segnalibro_pgdata:
    name: segnalibro_pgdata
  segnalibro_storage:
    name: personal_library_storage

networks:
  proxy:
    external: true
