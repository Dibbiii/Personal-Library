<!-- Pila di libri orizzontali (80x46), dal basso: olive, rosa, bordeaux. Colori via CSS custom property (nessun hex). Token usati: --color-divider, --color-accent, --color-primary; highlight bianchi rgba(255,255,255,.3/.4/.25) = overlay neutro. Va inlinato nel DOM (non <img>) perche' le var() ereditino dal tema. -->
<svg xmlns="http://www.w3.org/2000/svg" width="80" height="46" viewBox="0 0 80 46" aria-hidden="true"><rect x="2" y="28" width="76" height="14" rx="2" fill="var(--color-divider)"/><rect x="2" y="29" width="76" height="3" fill="rgba(255,255,255,.3)"/><rect x="8" y="14" width="64" height="14" rx="2" fill="var(--color-accent)"/><rect x="8" y="15" width="64" height="3" fill="rgba(255,255,255,.4)"/><rect x="4" y="2" width="68" height="12" rx="2" fill="var(--color-primary)"/><rect x="4" y="3" width="68" height="3" fill="rgba(255,255,255,.25)"/></svg>
