<!-- Tazza fumante (46x50). Colori via CSS custom property (nessun hex). Token usati: --color-divider (vapore, opacity .7), --color-primary (tazza/manico), --color-accent (bordo liquido, opacity .5). Va inlinato nel DOM (non <img>) perche' le var() ereditino dal tema. -->
