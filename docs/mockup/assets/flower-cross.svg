<!-- Fiore del Cimitero DNF (24x24, renderizzato a 22px, stroke 1.6). Nel mockup lo span genitore ha color:#F2AEBC ma il path NON ha fill (fill="none"): si vede solo il contorno bordeaux. Colori via CSS custom property (nessun hex). Token usati: --color-primary-deep (#570F1D = "primary" della spec), opzionale fill --color-accent. Va inlinato nel DOM (non <img>) perche' le var() ereditino dal tema. -->
