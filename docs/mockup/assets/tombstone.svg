<!-- Lapide (120x156 esempio; nel mockup e' un div CSS: border-radius 52px 52px 10px 10px, gradient 180deg, bordo 1.5px, ombra). Questa e' la versione SVG equivalente, scalabile in larghezza con preserveAspectRatio=none NON consigliato: preferire il CSS in css-illustrations.md. Colori via CSS custom property (nessun hex). Token usati: --tomb-top (#F6EAE7 NON in spec), --tomb-bottom (#E6D2CF NON in spec), --color-shelf-axis stroke .22. Va inlinato nel DOM (non <img>) perche' le var() ereditino dal tema. -->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="156" viewBox="0 0 120 156" aria-hidden="true"><defs><linearGradient id="tomb-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--tomb-top)"/><stop offset="1" stop-color="var(--tomb-bottom)"/></linearGradient></defs><path d="M.75 52.75A52 52 0 0 1 52.75 .75H67.25A52 52 0 0 1 119.25 52.75V145.25A10 10 0 0 1 109.25 155.25H10.75A10 10 0 0 1 .75 145.25Z" fill="url(#tomb-g)" stroke="var(--color-shelf-axis)" stroke-opacity=".22" stroke-width="1.5"/></svg>
