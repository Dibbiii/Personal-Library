<!-- Candela accesa (46x72). Alone + fiamma + stoppino + corpo. Colori via CSS custom property (nessun hex). Token usati: --color-accent (alone, opacity .35), --color-flame (#E8843A nel mockup = base Distopia), --color-flame-core (#FBE3CC = light Distopia), --color-shelf-axis (stoppino, #323522), --color-surface (cera), --color-wax-edge (contorno, #C9A08A NON in spec), --color-background (riflesso). Va inlinato nel DOM (non <img>) perche' le var() ereditino dal tema. -->
<svg xmlns="http://www.w3.org/2000/svg" width="46" height="72" viewBox="0 0 46 72" aria-hidden="true"><circle cx="23" cy="20" r="20" fill="var(--color-accent)" opacity=".35"/><path d="M23 3c4 6 5 9 0 14-5-5-4-8 0-14z" fill="var(--color-flame)"/><path d="M23 8c2 3 2.5 4.5 0 7-2.5-2.5-2-4 0-7z" fill="var(--color-flame-core)"/><rect x="21.5" y="16" width="3" height="7" rx="1" fill="var(--color-shelf-axis)"/><rect x="6" y="24" width="34" height="46" rx="8" fill="var(--color-surface)" stroke="var(--color-wax-edge)" stroke-width="2"/><rect x="10" y="34" width="26" height="31" rx="5" fill="var(--color-background)"/></svg>
